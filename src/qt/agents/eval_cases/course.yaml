# The agent test set (runtime plan 8.3): cases from the application lessons (098-102) where the lecturer's decision
# is known. Built from the spike's scenarios (project files spike/scenarios/E2E-1..5: input.md = the facts before the
# decision, key.md = what the lecturer did, with the line in course/transcripts-clean).
#
# Each case is one card, with the facts as they were known that day and the earlier cards' answers in the world, so
# one card is tested at a time. expect = the lecturer's decision as a card option; near = an option that is close
# (it counts apart from a miss); anything else is a miss. reading: true when the option is our reading of what he
# said and not his words; Ilay reviews those (24.10). Free-text cards (DC-12, DC-25, DC-26) are not scored here.
#
# traps: decisions with a planted flaw that the code's checks let through, for the Critic to catch; control: a sound
# decision the Critic should pass.

