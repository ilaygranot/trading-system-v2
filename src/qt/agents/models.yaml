# Pinned models per agent (runtime plan 8.2). Changing a model is a deliberate change that must pass the
# course test set (8.3), never a silent update. Prices per million tokens (input, output, cache read),
# used for the agent_calls cost and the daily budget.
models:
  opus: claude-opus-5-5
  sonnet: claude-sonnet-5-5
  haiku: claude-haiku-5-5
prices:                       # USD per 1M tokens: input, output, cache_read, cache_write (5m)
  claude-opus-5-5: [4.00, 20.00, 0.20, 5.00]
  claude-sonnet-5-5: [2.00, 10.00, 0.20, 2.50]
  claude-haiku-5-5: [0.10, 0.50, 0.01, 0.125]
agents:                       # model, effort, and the model to escalate to (flagged conflict, event, critic issue)
  A1: {model: opus, effort: high}
  A2: {model: opus, effort: high, routine: {model: sonnet, effort: medium}}
  A3: {model: sonnet, effort: medium, escalate: opus}
  A4: {model: opus, effort: high}
  A5: {model: sonnet, effort: medium, escalate: opus, screen: {model: haiku, effort: low}}
  A6: {model: opus, effort: high}
  A7: {model: sonnet, effort: medium, escalate: opus}
  A8: {model: sonnet, effort: low}
  C: {model: sonnet, effort: high, escalate: opus, always_opus_for: [A6]}
  L: {model: opus, effort: high}
fallbacks: default            # server-side refusal fallback (beta server-side-fallback-2026-07-01); not on Haiku
max_tokens: 16000
max_tokens_by_card:           # the article writes 13 sections; 21,000 is the SDK's ceiling without streaming (not from course)
  DC-25: 21000
  DC-27: 16000
budget:
# The agents run on Ilay's subscription (CLAUDE_CODE_OAUTH_TOKEN): the cost is the list price the CLI reports, not a
# bill. The caps are a guard against a runaway loop, set well above a full run, so a run is never cut short (Ilay
# 24.10: the first weekly run spent ~$25 at list price before the articles). On the API they would be real money.
  monthly_usd: 150            # the Anthropic console limit when on the API (runtime plan 8.4); not read by code
  daily_usd: 40               # over it, only A7 and the Critic keep running, and Ilay gets a message
  weekly_research_usd: 150    # the Saturday research run (A1, A3, A4, A6 + Critic), instead of the daily cap (not from course)
  always_run: [A7, C]
eval:                         # the course test set, `qt eval agents` (runtime plan 8.3; Ilay 24.10, not from course)
  limit_usd: 100              # one cap over the whole run, at list price (on the subscription it is not billed)
  pass_share: 0.8             # at least 80% hit or near, and no miss on a card that needs Ilay's approval
  models: [opus, sonnet]
