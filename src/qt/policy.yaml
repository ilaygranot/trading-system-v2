# Every number the code enforces, with where it comes from.
# Source of truth: playbook/decisions.md (sections א and ד) and playbook/tiers/*.csv.
# Changing a value here is a Playbook change: it needs Ilay's approval and a new playbook_version.
playbook_version: "2026-10-20"

sizing:
  initial_position_pct: 6.0        # S11-R5, decision 4
  full_position_pct: 12.0          # S11-R6, decision 4
  max_risk_per_trade_pct: 3.0      # decision 5 (not from course); a size cap, reduces quantity (W13)

exposure:
  gross_max: 1.2                   # S11-R15, decision 7; raise to 1.5/1.8 only with Ilay's approval
  gross_steps: [1.2, 1.5, 1.8]
  caps: {long_max: 1.0, short_max: 0.3, net_max: 0.9}   # D-S11-7, Ilay 22.10 (a flag only); `caps` in the portfolio file overrides

options:
  total_cap_pct: 20.0              # S11-R22, decision 6 (no options experience)
  short_dated_cap_pct: 10.0        # "short" = expiry within short_dated_days
  short_dated_days: 31
  contract_too_costly_pct: 3.0     # S10-R15 term #9: one contract > 3% of account
  profit_take_gain_pct: 150.0      # S12-R11: options 60/40 at +150%
  profit_take_share: 0.60

stop:
  adr_period_days: 60              # S11-R24, D-S11-8 (084 definition: mean of (H-L)/C)
  k_default: 4.0                   # S11-R11, decision 3/5 (20.10 evening)
  k_hard_min: 3.0                  # entry stop only; trailing 60/40 stop is exempt (fix 10)
  k_needs_reason_below: 4.0        # 3x..4x allowed with a written reason (DC-19)
  huge_stop_pct: 30.0              # 084-R05; term #10
  adr_route_to_options_pct: 10.0   # ADR60 > 10% => check as an option (term #10, rounding not from course)

reward_risk:
  min_ratio: 3.0                   # S10-R3, S11-R8, decision 9 (also options, from premium)
  target_sources: [technical_level, own_multiple_target, all_time_high_target]

horizon:
  default_max_months: 3            # decision 2
  extended_max_months: 6           # only with a documented catalyst chain
  # beyond 6 months => flag horizon_beyond_6m, not a block (part ד decision 2)

portfolio_stop:
  drawdown_pct: 15.0               # S12-R1, decision 8; latched until Ilay releases (part ד decision 4)

winner:
  rebalance_flag_pct: 24.0         # S12-R12 term #16 (choice not from course)
  rebalance_mandatory_pct: 30.0    # S12-R12

sixty_forty:
  stock_trigger_r: 3.0             # D-S12-4: open profit >= 3R (not from course)
  stock_keep_share: 0.60           # keep 60% of open profit "no matter what"

sectors:
  min_sectors: 4                   # S11-R2, decision 10
  min_sectors_with_shorts: 3       # documented exception, Ilay approves

floors:
  long_min_market_cap: 500_000_000       # S06-R6
  long_min_price: 5.0              # S06-R9
  long_min_revenue: 300_000_000        # S06-R10
  long_priority_cap_range: [2_000_000_000, 30_000_000_000]
  short_min_market_cap: 10_000_000_000     # S06-R8, S10-R13
  short_priority_min_cap: 20_000_000_000

regime:
  atr_short: 20                    # S12-R25 (084): ATR20 - ATR60 of S&P 500
  atr_long: 60
  sigma_pct: 0.325
  vix_jump_ratio: 1.4              # S12-R24: ~40% above recent low => FLAG ONLY (Ilay 20.10)
  vix_low_window_days: 20          # D-S12-2: window not from course
  vix_hist_mean: 19.5

traffic_light:
  red_sources_for_red: 4           # S09-R13 term #5: 4+ of 7 red => red

conduct:
  reentries_after_stops: 2         # D-S13-1: third entry after two stops is flagged
  reentry_window_days: 30
  fomo_move_pct: 40.0              # S13-R5 example: +40% in two weeks
  fomo_window_days: 14
  no_entry_before: "10:00"         # S10-R25, New York time

timing:                            # S09; part ג recommendations where the course is silent
  price_behavior_intervals: [year, quarter, month, week]   # S09-R11, D-S09-2 (a)
  counted_intervals: [quarter, month, week, day]           # PSAR / Volatility Stop, D-S09-2 (a)
  sma_periods: [21, 63, 252]       # D-S09-3 (b), 082
  extended_days: 21                # D-S09-4 (a): >21 sessions with the daily low not touching MA21
  rsi_period: 20                   # S09-R19
  rsi_slope_days: 3                # not from course: "rising/falling" over 3 sessions
  rsi_settled_days: 5              # not from course: "for a while" above 50
  macd: [20, 60, 10]               # S09-R21: EMA20 - EMA60, signal EMA10
  psar: [0.02, 0.2]                # S09-R22: step 0.02, max 0.2
  vol_stop:                        # S09-R23: [ATR period, multiplier]
    day: [20, 2.5]
    week: [50, 2.0]
    month: [24, 1.5]
    quarter: [8, 1.5]              # D-S09-5: multiplier NOT VERIFIED (check video 080 part 10)
  atr_ratio_wait: 1.5              # D-S09-10: ATR20/ATR60 >= 1.5 => flag "wait 1-2 weeks"

screening:                         # S06; part ג recommendations where the course is silent
  exchanges: [NASDAQ, NYSE]        # S06-R5
  eps_zero_replacement: -0.1       # D-S06-4
  coded_growth_pct: 99.0           # S06-R14
  base_effect_eps: 0.10            # D-S06-6 (c): |base EPS| <= 0.10 excluded from growth averages
  base_effect_growth_pct: 200.0    # D-S06-6 (c)
  outlier_growth_pct: 500.0        # 070 safety net
  pe_outlier: 500.0                # S06-R20
  similar_band_pp: 3.0             # D-S06-9: "like the sector" = within ±3 points both years
  verify_growth_pct: 200.0         # S06-R21
  mismatch_pct: 10.0               # S06-R43 / D-S07-6: second source differs > 10% => star
  short_float_max_pct: 20.0        # S06-R36
  days_to_cover_max: 10.0          # D-S06-12
  guidance_change_min_pct: 8.0     # S06-R39, decision 13
  loss_to_profit_multiple: 2.0     # S06-R40: next-year EPS >= 2x the loss (inferred from examples)
  long_rank: [L1, L2, L7, L3, L6, L4, L3*, L8]            # decision 12; L3* = L3 with y2_below_sector; L5 dropped
  short_rank: [S_acute, S_consistent, S_relative]          # D-S06-11

macro:                             # S01-S03; part ג recommendations where the course is silent
  hy_ma_days: 250                  # S01-R3: MA of ~1 year of trading days
  hy_chg_short_days: 60            # S01-R5
  curve_pair: [DGS10, DGS3MO]      # D-S01-2: 10Y - 3M, monthly average < 0 = inverted (not from course: the pair)
  commodity_extreme_yoy_pct: 100.0 # S01-R17
  activity_indicators: [ism_pmi, ism_nmi, michigan, permits, small_business]   # D-S02-7 (a): five, scale = 50
  level_ref:                       # D-S02-6
    ism_pmi: {kind: fixed, value: 50}
    ism_nmi: {kind: fixed, value: 50}
    michigan: {kind: linear_trend}           # 068 Excel method (≈85 sanity check)
    permits: {kind: moving_average, months: 24}
    small_business: {kind: moving_average, months: 60}
  points: {level: 3, yoy: 3, half: 2, quarter: 2}   # S02-R41 (096)
  zones:                           # decision 14 (by the course, 096): percent of max
    extreme_cold_max: 10
    grey_low: [10, 20]
    hot_min: 50
    grey_high: [80, 90]
    extreme_heat_min: 90
  bias: {extreme_heat: neutral, hot: bullish, cold: bearish, extreme_cold: cautious_optimism}  # S02-R47
  ism_trend_months: 3              # D-S02-3 (c)
  ism_extreme_low: 40              # D-S02-4 (c) / 068: rising from ≈40 => positive cycle
  ism_extreme_band: 2              # "≈40": within 2 points counts as the extreme (not from course)
  inflation_target: 2.0            # decision 15
  inflation_range: [2.0, 3.0]      # decision 15 (096)
  unemployment_ma_months: 60       # S02-R24: 5-year average
  fed_points: {ffr_down: 4, m2_above_trend: 3, balance_sheet_up: 3}   # D-S02-8 (b), not from course: the weights
  bear_drawdown_pct: 20.0          # S03-R6
  correction_drawdown_pct: 10.0    # not from course: label only, between bull and bear
  breadth_ma200: {high: 80, low: 20}   # D-S03-3
  weekly_breaks_flag_pct: 40.0     # D-S03-3
  quadrant_assets:                 # S03-R4 (066 slide)
    growth+_inflation+: [equities, commodities, real_estate]
    growth+_inflation-: [equities, corporate_bonds, cash]
    growth-_inflation-: [long_govt_bonds, cash]
    growth-_inflation+: [inflation_linked_govt_bonds, commodities, cash]

sector_scorecard:                  # S04-S05; part ג recommendations where the course is silent
  universe: [XLK, XLY, XLI, XLE, XLRE, XLC, XLF, XLV, XLU, XLB, XLP]   # S04-R9
  benchmark: SPY
  type:                            # D-S04-1 (c): 092 + industrials cyclical; sub-industry overrides allowed (A&D)
    XLRE: cyclical
    XLF: cyclical
    XLY: cyclical
    XLB: cyclical
    XLI: cyclical
    XLC: cyclical
    XLE: cyclical
    XLK: growth
    XLV: defensive
    XLU: defensive
    XLP: defensive
  rs_periods: {1w: 5, 1m: 21, 3m: 63, 6m: 126, 1y: 252}   # S04-R11, trading days
  rs_ma: {qma: 63, yma: 252}       # S04-R14: confirmation only
  cycle_table:                     # S04-R5 (069): ++ / + / - per phase; unlisted = no sign
    recovery: {XLI: "++", XLB: "++", XLRE: "+", XLF: "+", XLY: "+", XLK: "+", XLU: "-", XLP: "-"}
    expansion: {XLY: "+", XLI: "+", XLRE: "+", XLC: "+"}
    slowdown: {XLY: "-", XLB: "-", XLP: "+", XLU: "+", XLC: "+", XLV: "+"}
    recession: {XLV: "+", XLU: "+", XLP: "+"}
  macro_points: {"++": 9, "+": 6, "": 3, "-": 0}          # D-S04-6 (c), approved 20.10 (mapping not from course)
  stance_shift: 3                  # S04-R7 tilt: hot => cyclicals +3 / defensives -3; cold the reverse (not from course: the size)
  buckets: {long: 3, short: 3}     # D-S04-3
  industry_min_stocks: 15          # D-S05-2
  similar_band_pp: 3.0             # same band as S06 (D-S06-9)
  ism_trend_months: 3              # D-S05-5

deepdive:                          # S07; part ג recommendations where the course is silent
  target_history_years: 3          # D-S07-4 (a): 3-year average P/E (profitable) or P/S (not profitable)
  acceleration_pp: 5.0             # S07-R11 "clearly above" the 5y average (example 20% vs 28-30%); 5 points not from course
  gap_stable_pp: 0.5               # S07-R12: gap change within ±0.5 points = stable (not from course)
  net_debt_rising_share: 0.66      # S07-R24 "notable rise over years": >= 2/3 of yearly steps up and last > first (not from course)
  surprise_usually_beats: 0.75     # S07-R31 "usually beats": share of beats (not from course)
  extreme_growth_pct: 200.0        # S07-R25: 200-300% => verify, never reject
  gate_questions: [sector_macro_supported, stands_out_vs_sector, growth_engines_identified]   # D-S07-8 (a)
  questions:                       # 074 ten questions (S07-R3); the rest lower confidence only
    - sector_macro_supported
    - stands_out_vs_sector
    - growth_engines_identified
    - competitive_advantage
    - business_model_flaws
    - macro_and_input_exposure
    - tail_and_head_winds
    - market_agrees
    - risks_from_10k
    - catalyst_expected
  valuation_only_reasons: [cheap_vs_sector, low_multiple, cheap, expensive]   # D-S07-7 (a): never a reason

watchlist:                         # S08; part ג recommendations where the course is silent
  review_days: 60                  # S08-R29, D-S08-1 (a): review flag, never automatic removal
  main_size: [8, 12]               # D-S08-5 (a)
  hot_max: 4                       # S07-R35 / D-S08-5: 3-4 hot
  soft_cap_total: 30               # D-S08-5 update: all lists together, warning only
  top_down_min_share: 0.5          # S08-R7, D-S08-8 (a): weekly metric, warning only
  narrow_range_pct: 25.0           # S08-R12: ~20% in two years and CL 70-85 (21%) are examples; 25 not from course
  analyst_target_material_pct: 50.0   # S08-R17 / AT-S08-12: +50% = material
  analyst_target_stale_pct: 12.0      # +12% and below = "didn't renew"; between = judgment with a reason
  explanation_fields: [what_it_does, affected_by, scenario, why_watch, waiting_for, diversification_role]   # S08-R3

manage:                            # S12 daily review of open positions; part ג recommendations where the course is silent
  tactical_exposure_target: 0.50   # S12-R26, D-S12-6 (a): cut until medium-long exposure < 50% of equity
  uniform_cut_share: 0.20          # S12-R26 quick alternative: 20% of every position (smallest of 20/30/40)
  high_beta: 2.0                   # S12-R26 (2) "very high beta" (example 2.1); 2.0 not from course
  shock_net_flag: 1.0              # S12-R7: net 1.1 is the example, not a threshold; flag from 1.0 (not from course)
  stress_drops_pct: [10, 20, 30]   # S12-R23
  beta_flag: 1.0                   # S12-R23: portfolio beta above 1 => flag

verification:                      # peer-review plan stage 1: data checks in code; not from course (operations)
  price_tol_pct: 0.5               # close vs a second source
  statement_tol_pct: 2.0           # revenue / EPS vs the filing (SEC)
  market_cap_tol_pct: 10.0         # price x shares on the last filing vs the vendor's market cap (buybacks move it)
  adr_ratios: [2, 3, 4, 5, 10]     # a per-share gap at one of these ratios is an ADR basis, not an error
  pe_range: [0, 200]               # forward P/E outside it is suspect
  sales_f1_max_ratio: 2.0          # next-year sales over last year's
  eps_basis_range: [0.8, 1.25]     # reported EPS / analyst F0
  bars_max_age_days: 4             # calendar days between the last daily bar and as_of
  daily_max_age_days: 5            # daily macro series (HY, curve)
  monthly_max_lag: 1               # months between as_of and the latest monthly value
  monthly_lag_overrides: {michigan: 2, cpi_yoy: 1}
  primary_domains: [sec.gov, federalreserve.gov, bls.gov, bea.gov, stlouisfed.org, ismworld.org, nfib.com,
                    prnewswire.com, businesswire.com, globenewswire.com, treasury.gov, eia.gov, sca.isr.umich.edu]
  aggregator_domains: [ycharts.com, tipranks.com, kalkinemedia.com, tradingeconomics.com, investinglive.com,
                       securities.io, wikipedia.org, marketbeat.com, seekingalpha.com, zacks.com, finance.yahoo.com]

runtime:                           # runtime plan 4-7; not from course (operations)
  timezone: America/New_York
  daily_at: "18:30"                # after the close
  premarket_at: "08:30"
  open_at: "09:35"                 # approved paper orders fill at the open (Ilay 23.10)
  weekly_at: "10:00"               # Saturday
  monthly_days: [8, 14]            # the Saturday after the first week of the month (S13)
  window_minutes: 30               # cron fires at both UTC hours (DST); the NY-time guard picks one
  recheck_move_pct: 2.0            # premarket: an item whose price moved more than this comes back as "changed"
  nyse_holidays: [2026-01-01, 2026-01-19, 2026-02-16, 2026-04-03, 2026-05-25, 2026-06-19, 2026-07-03, 2026-09-07,
                  2026-11-26, 2026-12-25, 2027-01-01, 2027-01-18, 2027-02-15, 2027-03-26, 2027-05-31, 2027-06-18,
                  2027-07-05, 2027-09-06, 2027-11-25, 2027-12-24]
