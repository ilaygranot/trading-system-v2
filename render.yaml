# Render Blueprint (runtime plan 3, 4, 9). Nothing here is deployed until Ilay connects the repo in Render.
# Schedules are UTC; each cron fires at both hours of the New York daylight-saving pair and
# `qt run <kind> --scheduled` lets exactly one through (qt.schedule). The second firing resumes a failed run once.
# Secrets are entered once, on qt-web (sync: false); the cron jobs copy them from qt-web (fromService envVarKey),
# so Render asks for each secret one time. After changing a secret on qt-web, run "Manual Sync" on the Blueprint.
# The IBKR login is entered on qt-ibgateway only. No secret is in this file.
# Optional keys (ANTHROPIC_API_KEY, FMP_API_KEY) are not copied to the crons: a fromService copy of a variable that
# qt-web does not have fails the whole sync. When one is added on qt-web, add its copy here too. FRED_API_KEY is
# copied to the weekly and monthly crons: it must be set on qt-web before this file syncs.
# The agents run on ANTHROPIC_API_KEY, or, when it is empty, on CLAUDE_CODE_OAUTH_TOKEN through the Claude Code CLI;
# the build copies the CLI binary (pinned) into ./bin because Render keeps only the project directory at runtime.

databases:
  - name: qt-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: qt-web
    runtime: python
    region: virginia
    plan: starter
    buildCommand: pip install '.[postgres,agents,web]' && curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308 && mkdir -p bin && cp -L $HOME/.local/bin/claude bin/claude
    startCommand: gunicorn qt.web:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: QT_DATABASE_URL
        fromDatabase: {name: qt-db, property: connectionString}
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false                       # leave empty to run the agents on the subscription token below
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false                       # Ilay's Claude subscription (22.10): the agents run through Claude Code
      - key: DISABLE_AUTOUPDATER
        value: "1"                        # the CLI stays at the pinned build
      - key: QT_START_EQUITY
        value: "10000"                    # the paper book's cash until the first portfolio or fill exists
      - key: FRED_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: SEC_CONTACT                 # contact email in the SEC User-Agent; SEC answers 403 without one
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: IBKR_HOST
        fromService: {type: pserv, name: qt-ibgateway, property: host}
      - key: IBKR_PORT
        value: "4004"                     # paper API (socat relay of 4002 inside the image)

  # IB Gateway, headless, always on (Ilay 22.10). Image: gnzsnz/ib-gateway (IB Gateway + IBC + Xvfb + socat),
  # pinned to a version so a redeploy never changes it by surprise. Private service: reachable only from the
  # other services here, never from the internet. Paper only and read-only until stage 9 (real money).
  - type: pserv
    name: qt-ibgateway
    runtime: image
    image:
      url: docker.io/gnzsnz/ib-gateway:10.50.1f
    region: virginia
    plan: standard                        # 2 GB: Java heap 1 GB + Xvfb; starter (512 MB) is not enough
    disk:                                 # a service with a disk is never run twice: Render stops the old instance
      name: ibgateway-disk                # before starting the new one, so a deploy can't start two sessions of the
      mountPath: /home/ibgateway/disk     # same IBKR user that log each other out (22.10). 1 GB, about $0.25/month.
      sizeGB: 1
    envVars:
      - key: TWS_USERID
        sync: false                       # a dedicated API user, not the one Ilay logs in with (one session per user)
      - key: TWS_PASSWORD
        sync: false
      - key: TRADING_MODE
        value: paper
      - key: READ_ONLY_API
        value: "yes"
      - key: TIME_ZONE
        value: America/New_York
      - key: AUTO_RESTART_TIME
        value: "11:45 PM"                 # daily restart that keeps the session (no daily 2FA)
      - key: TWOFA_TIMEOUT_ACTION
        value: restart
      - key: RELOGIN_AFTER_TWOFA_TIMEOUT
        value: "yes"
      - key: EXISTING_SESSION_DETECTED_ACTION
        value: primaryoverride            # a deploy runs the new instance beside the old one with the same user:
                                          # the new one takes the session (with "primary" it exits, IBC error 1100)
      - key: JAVA_HEAP_SIZE
        value: "1024"

  - type: cron
    name: qt-daily                        # 18:30 New York, trading days
    runtime: python
    region: virginia
    plan: starter
    schedule: "30 22,23 * * 1-5"
    buildCommand: pip install '.[postgres,agents]' && curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308 && mkdir -p bin && cp -L $HOME/.local/bin/claude bin/claude
    startCommand: qt run daily --scheduled
    envVars:
      - key: QT_PUBLIC_URL                # public https URL of qt-web, for the signed "details" links in Telegram
        fromService: {type: web, name: qt-web, envVarKey: RENDER_EXTERNAL_URL}
      - key: QT_DATABASE_URL
        fromDatabase: {name: qt-db, property: connectionString}
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CLAUDE_CODE_OAUTH_TOKEN
        fromService: {type: web, name: qt-web, envVarKey: CLAUDE_CODE_OAUTH_TOKEN}
      - key: DISABLE_AUTOUPDATER
        value: "1"
      - key: QT_START_EQUITY
        value: "10000"                    # the paper book's cash until the first portfolio or fill exists
      - key: TELEGRAM_BOT_TOKEN
        fromService: {type: web, name: qt-web, envVarKey: TELEGRAM_BOT_TOKEN}
      - key: TELEGRAM_CHAT_ID
        fromService: {type: web, name: qt-web, envVarKey: TELEGRAM_CHAT_ID}
      - key: DASHBOARD_PASSWORD
        fromService: {type: web, name: qt-web, envVarKey: DASHBOARD_PASSWORD}
      - key: IBKR_HOST
        fromService: {type: pserv, name: qt-ibgateway, property: host}
      - key: SEC_CONTACT
        fromService: {type: web, name: qt-web, envVarKey: SEC_CONTACT}
      - key: IBKR_PORT
        value: "4004"

