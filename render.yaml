# Render Blueprint (runtime plan 3, 4, 9). Nothing here is deployed until Ilay connects the repo in Render.
# Schedules are UTC; each cron fires at both hours of the New York daylight-saving pair and
# `qt run <kind> --scheduled` lets exactly one through (qt.schedule). The second firing resumes a failed run once.
# Secrets are entered in the Render dashboard (sync: false); none is in this file.

databases:
  - name: qt-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: qt-web
    runtime: python
    region: virginia
    plan: starter
    buildCommand: pip install '.[postgres,agents,web]'
    startCommand: gunicorn qt.web:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: QT_DATABASE_URL
        fromDatabase: {name: qt-db, property: connectionString}
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

  - type: cron
    name: qt-daily                        # 18:30 New York, trading days
    runtime: python
    region: virginia
    plan: starter
    schedule: "30 22,23 * * 1-5"
    buildCommand: pip install '.[postgres,agents]'
    startCommand: qt run daily --scheduled
    envVars: &secrets                     # the same keys for every cron job
      - key: QT_PUBLIC_URL                # for the signed "details" links in Telegram
        fromService: {type: web, name: qt-web, property: host}
        - key: QT_DATABASE_URL
          fromDatabase: {name: qt-db, property: connectionString}
        - key: PYTHON_VERSION
          value: "3.12.7"
        - key: ANTHROPIC_API_KEY
          sync: false
        - key: FRED_API_KEY
          sync: false
        - key: FMP_API_KEY
          sync: false
        - key: TELEGRAM_BOT_TOKEN
          sync: false
        - key: TELEGRAM_CHAT_ID
          sync: false
        - key: DASHBOARD_PASSWORD
          sync: false

  - type: cron
    name: qt-premarket                    # 08:30 New York, trading days
    runtime: python
    region: virginia
    plan: starter
    schedule: "30 12,13 * * 1-5"
    buildCommand: pip install '.[postgres,agents]'
    startCommand: qt run premarket --scheduled
    envVars: *secrets

  - type: cron
    name: qt-weekly                       # Saturday 10:00 New York
    runtime: python
    region: virginia
    plan: standard                        # 2 GB: the research run holds the whole universe (~100 MB pickled) in memory
    schedule: "0 14,15 * * 6"
    buildCommand: pip install '.[postgres,agents]'
    startCommand: qt run weekly --scheduled
    envVars: *secrets

  - type: cron
    name: qt-monthly                      # the Saturday in days 8-14 (after the first week, S13), 10:00 New York
    runtime: python
    region: virginia
    plan: starter
    schedule: "0 14,15 * * 6"
    buildCommand: pip install '.[postgres,agents]'
    startCommand: qt run monthly --scheduled
    envVars: *secrets
