      - key: IBKR_HOST
        fromService: {type: pserv, name: qt-ibgateway, property: host}
      - key: IBKR_PORT
        value: "4004"


  - type: cron
    name: qt-open                         # 09:35 New York, trading days: approved paper orders fill at the open
    runtime: python
    region: virginia
    plan: starter
    schedule: "35 13,14 * * 1-5"
    buildCommand: pip install '.[postgres,agents]' && curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308 && mkdir -p bin && cp -L $HOME/.local/bin/claude bin/claude
