  - type: cron
    name: qt-weekly                       # Saturday 10:00 New York
    runtime: python
    region: virginia
    plan: standard                        # 2 GB: the research run holds the whole universe (~100 MB pickled) in memory
    schedule: "0 14,15 * * 6"
    buildCommand: pip install '.[postgres,agents]' && curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308 && mkdir -p bin && cp -L $HOME/.local/bin/claude bin/claude
    startCommand: qt run weekly --scheduled
    envVars:
